name: Release

# Builds and publishes the multi-arch Docker image to GHCR whenever a version
# tag (e.g. v0.2.3) is pushed. The KOReader plugin bundled in the image (served
# by the "KOReader Plugin" download button) is stamped with the same version, so
# it matches the archive attached to the GitHub Release by plugin-release.yaml.
on:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Stamp plugin metadata
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: ./stamp-plugin-meta.sh "${TAG#v}" "$REPOSITORY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/guerrerotook/koinsight
          # Publish v0.2.3, 0.2.3, and (for non-prerelease tags) latest.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
